services:
  db:
    image: postgres:16
    environment:
      POSTGRES_USER: sortflow
      POSTGRES_PASSWORD: sortflow
      POSTGRES_DB: sortflow
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data

  backend:
    build: ./backend
    ports:
      - "8000:8000"
    environment:
      DATABASE_URL: postgresql://sortflow:sortflow@db:5432/sortflow
    depends_on:
      - db
    volumes:
      - ./backend:/app

volumes:
  pgdata: